<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Heart-first meal plan</title>
<style>
  :root{
    --bg:#F6F2E9; --card:#FFFFFF; --ink:#2A3A30; --inkSoft:#6E7A6F;
    --herb:#2F6B4F; --herbSoft:#E4EFE7; --amber:#C97F2B; --amberSoft:#F6E9D6;
    --rose:#B65C5C; --roseSoft:#F4E4E4; --line:#E5DFD2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;
  }
  .app{max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  .serif{font-family:Georgia,'Times New Roman',serif;}
  header{padding:24px 20px 12px;}
  .kicker{text-transform:uppercase; letter-spacing:.12em; font-size:11px; color:var(--inkSoft); margin:0 0 4px;}
  h1{font-family:Georgia,serif; font-size:28px; line-height:1.15; margin:0 0 14px; font-weight:normal;}
  .toggle{display:flex; background:#EAE4D6; border-radius:999px; padding:4px;}
  .toggle button{
    flex:1; padding:9px 0; border:none; border-radius:999px; background:transparent;
    color:var(--inkSoft); font-size:14px; font-weight:600; cursor:pointer;
  }
  .toggle button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .target{margin:8px 0 0; text-align:center; font-size:12px; color:var(--inkSoft);}
  .note{margin-top:8px; border-radius:12px; padding:8px 12px; font-size:12px; background:var(--amberSoft); color:#7A5217; line-height:1.4;}
  main{flex:1; padding:0 20px 110px;}
  .dayscroll{display:flex; gap:6px; overflow-x:auto; padding:0 0 12px; scrollbar-width:none;}
  .dayscroll::-webkit-scrollbar{display:none;}
  .chip{
    padding:8px 12px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap;
    background:var(--card); color:var(--inkSoft); border:1px solid var(--line); cursor:pointer;
  }
  .chip.on{background:var(--ink); color:#fff;}
  .progress{display:flex; align-items:center; gap:12px; margin:4px 0 16px;}
  .dots{display:flex; gap:6px;}
  .dot{width:10px; height:10px; border-radius:999px; background:#D9D2C2;}
  .dot.on{background:var(--herb);}
  .progress span{font-size:14px; color:var(--inkSoft);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;}
  .card.done{background:var(--herbSoft); border-color:#CBE0D2;}
  .label{text-transform:uppercase; font-size:10px; letter-spacing:.1em; color:var(--inkSoft); margin:0 0 4px;}
  .mealname{font-family:Georgia,serif; font-size:18px; margin:0 0 4px;}
  .desc{font-size:14px; color:var(--inkSoft); margin:0 0 12px; line-height:1.5;}
  .btnrow{display:flex; gap:8px; margin-top:8px;}
  .btn{flex:1; padding:12px 0; border:none; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-ink{background:var(--ink); color:#fff;}
  .btn-herb{background:var(--herb); color:#fff;}
  h2{font-family:Georgia,serif; font-size:20px; font-weight:normal; margin:0 0 12px;}
  .feel{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .feel button{padding:12px 0; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; border:1px solid transparent;}
  .vitals{display:flex; gap:8px; margin-bottom:12px;}
  .vitals > div{flex:1;}
  .flabel{font-size:12px; font-weight:600; color:var(--inkSoft);}
  input,textarea{
    width:100%; border-radius:12px; padding:12px; font-size:14px; margin-top:4px;
    background:var(--bg); border:1px solid var(--line); color:var(--ink);
    font-family:inherit; resize:none;
  }
  .hint{font-size:12px; color:var(--inkSoft); margin:8px 0 0; line-height:1.4;}
  .histhead{text-transform:uppercase; font-size:10px; letter-spacing:.1em; color:var(--inkSoft); margin:0 0 8px;}
  .hist{display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;}
  .hdot{width:10px; height:10px; border-radius:999px; margin-top:6px; flex-shrink:0;}
  .hist .d{font-size:14px; font-weight:600; margin:0;}
  .hist .s{font-size:14px; color:var(--inkSoft); margin:2px 0 0; line-height:1.4;}
  nav{
    position:fixed; bottom:0; left:0; right:0; max-width:460px; margin:0 auto;
    display:flex; background:var(--card); border-top:1px solid var(--line);
  }
  nav button{flex:1; padding:12px 0; border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; color:#A9A293;}
  nav button.on{color:var(--ink);}
  nav .ico{font-size:18px;}
  nav .txt{font-size:12px; font-weight:600;}
  .disclaimer{font-size:11px; color:var(--inkSoft); text-align:center; padding:0 20px 8px; line-height:1.5;}
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="kicker">Mediterranean · heart-first</p>
    <h1 id="title"></h1>
    <div class="toggle" id="persontoggle">
      <button data-p="john">John</button>
      <button data-p="jane">Jane</button>
    </div>
    <p class="target" id="target"></p>
    <div class="note" id="betaloc"></div>
  </header>
  <main id="main"></main>
  <p class="disclaimer">Portfolio demo — names anonymised (John &amp; Jane are placeholders). A guide, not medical advice. Check any real plan with a cardiologist or GP before making changes.</p>
  <nav id="nav">
    <button data-t="today"><span class="ico">🍳</span><span class="txt">Today</span></button>
    <button data-t="week"><span class="ico">📋</span><span class="txt">Week</span></button>
    <button data-t="journal"><span class="ico">❤️</span><span class="txt">Journal</span></button>
  </nav>
</div>

<script>
/* ---------- Data ---------- */
var DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

var JANE_PLAN = {
  Monday:{drink:"Coffee or tea with a splash of cream (20ml)",
    breakfast:{name:"Eggs with feta & spinach",desc:"3 eggs in 1 tbsp olive oil with 60g wilted spinach and 30g feta. Side: 100g Greek yoghurt, 50g berries, 10g pumpkin seeds."},
    lunch:{name:"Monday leftovers: roast chicken salad",desc:"100g of Sunday's roast chicken over 60g greens with half an avocado, 50g cucumber, 5-6 olives, 1 tbsp olive oil and lemon. Zero cooking."},
    dinner:{name:"Beef steak & sauteed cabbage",desc:"200g steak — the anchor meal. 150g cabbage in 1 tbsp olive oil with garlic, 5g butter to finish."}},
  Tuesday:{drink:"Coffee or tea with a splash of cream",
    breakfast:{name:"Greek yoghurt & berry bowl",desc:"150g Greek yoghurt with 50g berries, 15g walnuts and 10g pumpkin seeds, plus 2 boiled eggs from Sunday's batch."},
    lunch:{name:"Sardine & avocado bowl",desc:"1 tin sardines (106g) over 60g spinach, half an avocado, 50g cucumber, lemon. Pack the night before."},
    dinner:{name:"Mediterranean chicken tray bake",desc:"200g chicken thighs roasted with 100g courgette, 80g cherry tomatoes, half a red onion and 5-6 olives in 1 tbsp olive oil and oregano. (Mushrooms work if courgettes are pricey.)"}},
  Wednesday:{drink:"Coffee or tea with a splash of cream",
    breakfast:{name:"Mushroom & herb omelette",desc:"3-egg omelette in 1 tbsp olive oil with 80g mushrooms and parsley, 60g spinach on the side. 150ml kefir to drink."},
    lunch:{name:"Hummus & veggie plate",desc:"60g hummus with 50g cucumber, 1 carrot in sticks, 5-6 olives, 2 boiled eggs and 3-4 seed crackers. No cooking."},
    dinner:{name:"Salmon with roasted veg",desc:"150g salmon fillet (frozen or fresh) in 1 tbsp olive oil with lemon, over roasted 100g courgette, half a red onion and 100g broccoli. (Cauliflower swaps in fine.)"}},
  Thursday:{drink:"Coffee or tea with a splash of cream",
    breakfast:{name:"Shakshuka",desc:"3 eggs poached in 200g tinned tomatoes with half a tsp paprika and garlic in 1 tbsp olive oil. 30g yoghurt on top."},
    lunch:{name:"Halloumi, avocado & olive salad",desc:"80g golden pan-fried halloumi over 60g greens with half an avocado, 50g cucumber and 5-6 olives. 10 minutes, very good."},
    dinner:{name:"Mince & lentil ragu",desc:"150g lean mince simmered with 100g drained canned lentils, 200g tinned tomatoes, garlic and herbs, over 150g cauliflower mash or wilted greens."}},
  Friday:{drink:"Coffee or tea with a splash of cream",
    breakfast:{name:"Overnight oats with berries",desc:"45g oats (half a cup) soaked in 150ml milk or kefir with 50g berries, 15g walnuts and cinnamon. Made Thursday night — no cooking on a Friday."},
    lunch:{name:"Smoked salmon & avocado plate",desc:"80g smoked salmon over 50g cucumber with half an avocado, 60g dressed greens and capers if you have them."},
    dinner:{name:"Chicken & mushroom pan with greens",desc:"200g crispy skin-on thighs in 1 tbsp olive oil, 80g mushrooms, 60g wilted spinach, 20ml cream in the pan sauce."}},
  Saturday:{drink:"Coffee or tea with a splash of cream",
    breakfast:{name:"Saturday fry-up (bacon day!)",desc:"The weekly bacon: 3 rashers, 3 fried eggs, 80g mushrooms, half an avocado, 60g spinach. Take your time."},
    lunch:{name:"Big Greek salad",desc:"40g feta, 5-6 olives, 80g cucumber, 80g cherry tomatoes, 60g greens, 1 tbsp olive oil and oregano. Add any leftover protein."},
    dinner:{name:"Lamb chops & roasted veg",desc:"Every other week: 200g lamb chops with rosemary. Alternate weeks: 150g salmon tray roast. 150g cauliflower, 100g pumpkin and half a red onion in 1 tbsp olive oil."}},
  Sunday:{drink:"Coffee or tea with a splash of cream",
    breakfast:{name:"Smoked salmon brunch plate",desc:"80g smoked salmon, 30g cream cheese, 50g cucumber, half an avocado. Slow Sunday brunch."},
    lunch:{name:"Lentil & roast veg salad with feta",desc:"100g drained lentils with 100g roasted pumpkin, half a red onion, 40g feta, 5-6 olives and 60g greens, 1 tbsp olive oil and lemon."},
    dinner:{name:"Sunday roast chicken",desc:"250g roast thighs with 100g broccoli, 100g pumpkin and half a red onion in 1 tbsp olive oil, lemon-garlic kefir dressing (50ml). Roast extra chicken and boil 6 eggs for the week ahead."}}
};

var JOHN_PLAN = {
  Monday:{drink:"Nothing Naughty bone broth protein — 30g in 300ml warm water",
    breakfast:{name:"Eggs with feta & spinach, big plate",desc:"4 eggs in 1 tbsp olive oil with 80g spinach, 40g feta and a whole avocado. Side: 150g yoghurt, 20g walnuts, 10g pumpkin seeds."},
    lunch:{name:"Monday leftovers: roast chicken salad",desc:"150g of Sunday's roast chicken over 80g greens with a whole avocado, 50g cucumber, 30g sun-dried tomatoes, 1 tbsp olive oil."},
    dinner:{name:"Beef steak & sauteed cabbage",desc:"250g steak — the weekly red meat anchor. 200g garlic cabbage in 1 tbsp olive oil, 100g mushrooms on the side."}},
  Tuesday:{drink:"Herbal tea — rooibos or ginger",
    breakfast:{name:"Greek yoghurt & berry bowl, big serve",desc:"200g Greek yoghurt with 50g berries, 20g walnuts and 10g pumpkin seeds, plus 3 boiled eggs from Sunday's batch."},
    lunch:{name:"Sardine & avocado bowl",desc:"Full large tin of sardines (120g) over 80g spinach, a whole avocado, 50g cucumber, lemon. The omega-3 anchor meal."},
    dinner:{name:"Mediterranean chicken tray bake",desc:"300g chicken thighs (2 large) roasted with 120g courgette, 100g cherry tomatoes, half a red onion and 30g sun-dried tomatoes in 1.5 tbsp olive oil and oregano."}},
  Wednesday:{drink:"Nothing Naughty bone broth protein",
    breakfast:{name:"Big mushroom & herb omelette",desc:"4-egg omelette in 1 tbsp olive oil with 100g mushrooms and parsley, 80g spinach on the side. 200ml kefir to drink."},
    lunch:{name:"Hummus & veggie plate",desc:"80g hummus with 80g cucumber, 1 carrot in sticks, 3 boiled eggs and 4-5 seed crackers. No cooking."},
    dinner:{name:"Salmon with roasted veg",desc:"200g salmon fillet (frozen or fresh) in 1.5 tbsp olive oil with lemon, over roasted 120g courgette, half a red onion and 120g broccoli."}},
  Thursday:{drink:"Chamomile tea (calming)",
    breakfast:{name:"Shakshuka, big pan",desc:"4 eggs poached in 250g tinned tomatoes with half a tsp paprika and garlic in 1.5 tbsp olive oil. 50g yoghurt on top."},
    lunch:{name:"Halloumi & avocado salad",desc:"100g golden pan-fried halloumi over 80g greens with a whole avocado, 50g cucumber and 20g walnuts."},
    dinner:{name:"Mince & lentil ragu",desc:"250g lean mince simmered with 150g drained canned lentils, 250g tinned tomatoes, garlic and herbs, over 200g cauliflower mash or wilted greens."}},
  Friday:{drink:"Peppermint tea",
    breakfast:{name:"Overnight oats with berries & eggs",desc:"60g oats soaked in 200ml milk or kefir with 50g berries, 20g walnuts and cinnamon, plus 2 boiled eggs for size."},
    lunch:{name:"Smoked salmon & avocado plate",desc:"120g smoked salmon over 80g cucumber with a whole avocado and 80g dressed greens."},
    dinner:{name:"Chicken & mushroom pan with greens",desc:"300g crispy skin-on thighs (2 large) in 1.5 tbsp olive oil, 100g mushrooms, 80g wilted spinach, 30ml cream in the sauce."}},
  Saturday:{drink:"Rooibos tea",
    breakfast:{name:"Saturday fry-up (bacon day!)",desc:"The weekly bacon: 3-4 rashers, 4 eggs, 100g mushrooms, a whole avocado, 80g spinach. Weekend pace."},
    lunch:{name:"Big Greek salad, no olives",desc:"60g feta, 30g sun-dried tomatoes, 100g cucumber, 100g cherry tomatoes, 80g greens, 1.5 tbsp olive oil — with a generous helping of leftover protein."},
    dinner:{name:"Lamb chops & roasted veg",desc:"Every other week: 2 lamb chops (250g) with rosemary. Alternate weeks: 200g salmon tray roast. 200g cauliflower, 150g pumpkin and half a red onion in 1.5 tbsp olive oil."}},
  Sunday:{drink:"Rooibos tea or bone broth protein",
    breakfast:{name:"Smoked salmon brunch plate",desc:"120g smoked salmon, 40g cream cheese, 80g cucumber, a whole avocado, plus 2 boiled eggs. Slow Sunday brunch."},
    lunch:{name:"Lentil & roast veg salad with feta",desc:"150g drained lentils with 150g roasted pumpkin, half a red onion, 60g feta, 30g sun-dried tomatoes and 80g greens, 1.5 tbsp olive oil and lemon, plus 2 boiled eggs for size."},
    dinner:{name:"Sunday roast chicken",desc:"350g roast thighs with 120g broccoli, 150g pumpkin and half a red onion in 1.5 tbsp olive oil, kefir dressing (50ml). Roast extra chicken and boil eggs for the week ahead."}}
};

var TARGETS = {
  john:"Eat to comfortable fullness · protein 150g+ · no calorie counting",
  jane:"Eat to comfortable fullness · protein ~100g · no calorie counting"
};
var BETALOC = "Built around Betaloc: ease into lower carbs over 2–3 weeks, salt food to taste in week one, stand up slowly, and no potassium supplements. Please confirm the plan with the cardiologist.";

var MEAL_KEYS = ["drink","breakfast","lunch","dinner"];
var MEAL_LABELS = {drink:"Morning drink",breakfast:"Breakfast",lunch:"Lunch",dinner:"Dinner"};
var FEELINGS = [
  {id:"good",label:"Felt fine",color:"#2F6B4F",soft:"#E4EFE7"},
  {id:"okay",label:"A bit off",color:"#C97F2B",soft:"#F6E9D6"},
  {id:"rough",label:"Fluttery / not great",color:"#B65C5C",soft:"#F4E4E4"}
];

/* ---------- State + storage ---------- */
var STORAGE_KEY = "heart-meal-plan-v1";
var state = {tab:"today", person:"john", eaten:{}, journal:[], weekDay:dayName(todayISO())};

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var d = JSON.parse(raw);
      state.person = d.person || "john";
      state.eaten = d.eaten || {};
      state.journal = d.journal || [];
    }
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({person:state.person, eaten:state.eaten, journal:state.journal}));
  }catch(e){}
}

/* ---------- Date helpers ---------- */
function todayISO(){
  var d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dayName(iso){
  var d = new Date(iso+"T12:00:00");
  return DAYS[(d.getDay()+6)%7];
}
function prettyDate(iso){
  var d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString("en-NZ",{weekday:"long",day:"numeric",month:"long"});
}

/* ---------- Helpers ---------- */
function plan(){ return state.person==="john" ? JOHN_PLAN : JANE_PLAN; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function isEaten(k){ return !!state.eaten[state.person+"|"+todayISO()+"|"+k]; }
function todayEntry(){
  return state.journal.find(function(j){ return j.person===state.person && j.date===todayISO(); });
}
function saveEntry(patch){
  var date = todayISO();
  var existing = state.journal.find(function(j){ return j.person===state.person && j.date===date; }) || {person:state.person, date:date};
  state.journal = state.journal.filter(function(j){ return !(j.person===state.person && j.date===date); });
  var merged = Object.assign({}, existing, patch);
  state.journal.push(merged);
  save();
}

/* ---------- Render ---------- */
function render(){
  // header
  var titles = {today:prettyDate(todayISO()), week:"This week's plan", journal:"How's it going"};
  document.getElementById("title").textContent = titles[state.tab];
  document.querySelectorAll("#persontoggle button").forEach(function(b){
    b.classList.toggle("on", b.dataset.p===state.person);
  });
  document.getElementById("target").textContent = TARGETS[state.person];
  var beta = document.getElementById("betaloc");
  if(state.person==="john"){ beta.style.display="block"; beta.textContent = BETALOC; }
  else { beta.style.display="none"; }
  document.querySelectorAll("#nav button").forEach(function(b){
    b.classList.toggle("on", b.dataset.t===state.tab);
  });

  var m = document.getElementById("main");
  if(state.tab==="today") m.innerHTML = renderToday();
  else if(state.tab==="week") m.innerHTML = renderWeek();
  else m.innerHTML = renderJournal();
  wire();
}

function renderToday(){
  var meals = plan()[dayName(todayISO())];
  var done = MEAL_KEYS.filter(isEaten).length;
  var dots = MEAL_KEYS.map(function(k){ return '<span class="dot'+(isEaten(k)?" on":"")+'"></span>'; }).join("");
  var status = done===4 ? "All done today — well done!" : done+" of 4 ticked off";
  var html = '<div class="progress"><div class="dots">'+dots+'</div><span>'+status+'</span></div>';
  html += MEAL_KEYS.map(function(k){
    var meal = k==="drink" ? {name:meals.drink, desc:""} : meals[k];
    var on = isEaten(k);
    return '<div class="card'+(on?" done":"")+'">'+
      '<p class="label">'+MEAL_LABELS[k]+'</p>'+
      '<p class="mealname">'+esc(meal.name)+'</p>'+
      (meal.desc?'<p class="desc">'+esc(meal.desc)+'</p>':'')+
      '<div class="btnrow"><button class="btn '+(on?"btn-herb":"btn-ink")+'" data-eat="'+k+'">'+(on?"✓ Eaten":"Mark as eaten")+'</button></div>'+
    '</div>';
  }).join("");
  return html;
}

function renderWeek(){
  var chips = DAYS.map(function(d){
    return '<button class="chip'+(d===state.weekDay?" on":"")+'" data-day="'+d+'">'+d.slice(0,3)+'</button>';
  }).join("");
  var meals = plan()[state.weekDay];
  var cards = MEAL_KEYS.map(function(k){
    var meal = k==="drink" ? {name:meals.drink, desc:""} : meals[k];
    return '<div class="card">'+
      '<p class="label">'+MEAL_LABELS[k]+'</p>'+
      '<p class="mealname" style="margin-bottom:'+(meal.desc?"4px":"0")+'">'+esc(meal.name)+'</p>'+
      (meal.desc?'<p class="desc" style="margin-bottom:0">'+esc(meal.desc)+'</p>':'')+
    '</div>';
  }).join("");
  return '<div class="dayscroll">'+chips+'</div><h2>'+state.weekDay+'</h2>'+cards;
}

function renderJournal(){
  var e = todayEntry() || {};
  var prompt = state.person==="john" ? "How did your heart feel today?" : "How did you feel today?";
  var feelBtns = FEELINGS.map(function(f){
    var sel = e.feeling===f.id;
    var st = sel ? 'background:'+f.color+';color:#fff;border-color:'+f.color : 'background:'+f.soft+';color:'+f.color;
    return '<button data-feel="'+f.id+'" style="'+st+'">'+f.label+'</button>';
  }).join("");

  var vitals = "";
  if(state.person==="john"){
    vitals = '<div class="vitals">'+
      '<div><span class="flabel">Blood pressure</span><input id="bp" value="'+esc(e.bp||"")+'" placeholder="e.g. 128/82" /></div>'+
      '<div><span class="flabel">Resting pulse</span><input id="pulse" value="'+esc(e.pulse||"")+'" placeholder="e.g. 64" /></div>'+
    '</div>';
  }
  var vitalHint = state.person==="john" ? '<p class="hint">BP and pulse once a week is plenty — same time of day, sitting, after 5 minutes of rest.</p>' : '';

  var card = '<div class="card">'+
    '<p class="mealname">'+prompt+'</p>'+
    '<p class="desc">A quick daily note builds a picture you can show the doctor.</p>'+
    '<div class="feel">'+feelBtns+'</div>'+
    vitals+
    '<textarea id="note" rows="2" placeholder="Anything to note? (optional — e.g. skipped lunch, busy day)">'+esc(e.note||"")+'</textarea>'+
    vitalHint+
  '</div>';

  var list = state.journal.filter(function(j){ return j.person===state.person; })
    .sort(function(a,b){ return a.date<b.date?1:-1; }).slice(0,14);
  var hist = '<p class="histhead">Last two weeks</p>';
  if(list.length===0){
    hist += '<p class="desc">No entries yet. Tap a feeling above to start the record.</p>';
  } else {
    hist += list.map(function(en){
      var f = FEELINGS.find(function(x){ return x.id===en.feeling; });
      var mealsDone = MEAL_KEYS.filter(function(k){ return state.eaten[en.person+"|"+en.date+"|"+k]; }).length;
      var v = [en.bp?"BP "+en.bp:"", en.pulse?"pulse "+en.pulse:""].filter(Boolean).join(" · ");
      var line = (f?f.label:"No feeling logged")+" · "+mealsDone+"/4 meals on plan"+(v?" · "+v:"")+(en.note?" · "+en.note:"");
      return '<div class="hist"><span class="hdot" style="background:'+(f?f.color:"#6E7A6F")+'"></span>'+
        '<div><p class="d">'+prettyDate(en.date)+'</p><p class="s">'+esc(line)+'</p></div></div>';
    }).join("");
  }
  return card + hist;
}

/* ---------- Wire up events after each render ---------- */
function wire(){
  document.querySelectorAll("[data-eat]").forEach(function(b){
    b.onclick = function(){
      var k = b.dataset.eat, key = state.person+"|"+todayISO()+"|"+k;
      state.eaten[key] = !state.eaten[key];
      save(); render();
    };
  });
  document.querySelectorAll("[data-day]").forEach(function(b){
    b.onclick = function(){ state.weekDay = b.dataset.day; render(); };
  });
  document.querySelectorAll("[data-feel]").forEach(function(b){
    b.onclick = function(){
      var patch = {feeling:b.dataset.feel};
      var note = document.getElementById("note"); if(note) patch.note = note.value;
      var bp = document.getElementById("bp"); if(bp) patch.bp = bp.value;
      var pulse = document.getElementById("pulse"); if(pulse) patch.pulse = pulse.value;
      saveEntry(patch); render();
    };
  });
  var note = document.getElementById("note");
  if(note) note.onblur = function(){ saveEntry({note:note.value}); };
  var bp = document.getElementById("bp");
  if(bp) bp.onblur = function(){ saveEntry({bp:bp.value}); };
  var pulse = document.getElementById("pulse");
  if(pulse) pulse.onblur = function(){ saveEntry({pulse:pulse.value}); };
}

/* ---------- Static nav / person events ---------- */
document.querySelectorAll("#persontoggle button").forEach(function(b){
  b.onclick = function(){ state.person = b.dataset.p; save(); render(); };
});
document.querySelectorAll("#nav button").forEach(function(b){
  b.onclick = function(){ state.tab = b.dataset.t; render(); };
});

load();
render();
</script>
</body>
</html>
